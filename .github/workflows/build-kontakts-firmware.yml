name: Build KONTAKTS firmware

on:
  push:
    paths:
      - 'firmware/KONTAKTS_ESP32_S3_LCD_1_47/**'
      - '.github/workflows/build-kontakts-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'

      - name: Configure ESP32 package index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 core 3.3.11
        run: arduino-cli core install esp32:esp32@3.3.11

      - name: Install display libraries
        run: |
          arduino-cli lib install 'Adafruit GFX Library'
          arduino-cli lib install 'Adafruit ST7735 and ST7789 Library'

      - name: Compile firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi' \
            --build-path build \
            firmware/KONTAKTS_ESP32_S3_LCD_1_47

      - name: Prepare merged firmware image
        run: |
          test -f build/KONTAKTS_ESP32_S3_LCD_1_47.ino.merged.bin
          cp build/KONTAKTS_ESP32_S3_LCD_1_47.ino.merged.bin KONTAKTS_ESP32-S3-LCD-1.47.bin
          sha256sum KONTAKTS_ESP32-S3-LCD-1.47.bin > KONTAKTS_ESP32-S3-LCD-1.47.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: KONTAKTS_ESP32-S3-LCD-1.47
          path: |
            KONTAKTS_ESP32-S3-LCD-1.47.bin
            KONTAKTS_ESP32-S3-LCD-1.47.bin.sha256
          if-no-files-found: error
