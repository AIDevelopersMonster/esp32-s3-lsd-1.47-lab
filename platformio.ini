[platformio]
default_envs = waveshare_esp32s3_lcd_147

[env:waveshare_esp32s3_lcd_147]
; Arduino-ESP32 3.x is required by the Waveshare documentation.
; The official PlatformIO Espressif32 package still ships Arduino 2.x,
; therefore this project pins a pioarduino release with Arduino 3.3.8.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit NeoPixel@^1.12.5
